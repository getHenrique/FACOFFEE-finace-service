server:
  port: 3003
  servlet:
    context-path: /api/finance

spring:
  application:
    name: financeService

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/facoffee

  datasource:
    url: jdbc:sqlite:src/main/resources/config/financePersistence.db
    driver-class-name: org.sqlite.JDBC
    username: facoffee
    password: facoffee

  rabbitmq:
    host: localhost
    port: 5672
    username: facoffee
    password: facoffee

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true